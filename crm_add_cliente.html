


<h2>Adicionar Cliente</h2>
<br>
<form method="post" class="row g-3" >
  <div class="col-md-6">
    <label for="nome" class="form-label">Nome</label>
    <input type="text" class="form-control" id="nome" name="nome">
  </div>

  

  <div class="col-md-6">
    <label for="email" class="form-label">Status de atendimento</label>
    <select name="email" id="email" class="form-select" aria-label="Default select example">
    <option selected>Status</option>
      <option value="Lead">Lead</option>
      <option value="Atendimento">Atendimento</option>
      <option value="Visita">Visita</option>
      <option value="Confecção de Contrato">Confecção de Contrato</option>
      <option value="Entrega de chaves">Entrega de Chaves</option>
  </select>
  </div>
  <div class="col-12">
    <label for="contato" class="form-label">Contato</label>
    <input type="text" class="form-control" id="contato" placeholder="" name="contato">
  </div>
  <div class="col-12">
    <label for="interesse" class="form-label">Interesse</label>
    <input type="text" class="form-control" id="interesse" placeholder="" name="interesse">
  </div>
  <div class="col-md-6">
    <label for="valor" class="form-label">Valor</label>
    <input type="text" class="form-control" id="valor" name="valor">
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Adicionar Cliente</button>
  </div>
</form>
