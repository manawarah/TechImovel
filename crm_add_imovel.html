

<!-- Formulário -->
<h2>Cadastrar Imóvel no CRM</h2>
<form method="POST" enctype="multipart/form-data">
    <input type="text" name="residencial" placeholder="Nome do Residencial" required><br><br>
    <input type="text" name="quartos" placeholder="Número de Quartos" required><br><br>
    <input type="text" name="valor" placeholder="Valor" required><br><br>
    <input type="text" name="bairro" placeholder="Bairro" required><br><br>
    <input type="text" name="pretencao" placeholder="Pretensão (Venda/Aluguel)" required><br><br>
    <input type="file" name="imagem"><br><br>
    <button type="submit" name="cadastrar" class="btn btn-success">Cadastrar Imóvel</button>
</form>
