
<!-- Formulário -->
<h2>Cadastrar Imóvel no CRM</h2>
<form action="#" enctype="multipart/form-data" method="POST" onsubmit="event.preventDefault(); alert('Simulação de envio bem-sucedida!');">
<input name="residencial" placeholder="Nome do Residencial" required="" type="text"/><br/><br/>
<input name="quartos" placeholder="Número de Quartos" required="" type="text"/><br/><br/>
<input name="valor" placeholder="Valor" required="" type="text"/><br/><br/>
<input name="bairro" placeholder="Bairro" required="" type="text"/><br/><br/>
<input name="pretencao" placeholder="Pretensão (Venda/Aluguel)" required="" type="text"/><br/><br/>
<input name="imagem" type="file"/><br/><br/>
<button class="btn btn-success" name="cadastrar" type="submit">Cadastrar Imóvel</button>
</form>
