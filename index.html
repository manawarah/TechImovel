<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!DOCTYPE html>

<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Login - TechImóvel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    * {

        padding: 0;
        border: 0;
        box-sizing: border-box;
        margin: 0;
        font-size: 16px;
        font-family: Poetsen One;
    }

    html {

        display: flex;
        justify-content: center;
        align-items: center;
    }
    body {
      background-color: #0F123F;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-box {
      background-color: #1B1E3F;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .btn-green {
      background-color: #00FF66;
      border: none;
      color: #000;
    }

    .btn-green:hover {
      background-color: #00cc55;
    }

    .logo {
      width: 120px;
      display: block;
      margin: 0 auto 1rem;

    }
  </style>
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }
    }
  </style>
</head>

<body style="display: grid;">
  <div class="login-box text-center">
    <img alt="Logo TechImóvel" class="logo" src="./assets/logo/logo-techimovel.jfif" style="border-radius: 80px;" />
    <h2 class="mb-4">TechImóvel</h2>
    <p style="font-size: 14pt;">App Tecnologia Imobiliária</p>
    <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Simulação de envio bem-sucedida!');">
      <div class="mb-3 text-start">
        <i class="bi bi-person" style="font-size: 30px;"></i>
        <input class="form-control" id="login" name="login" placeholder="Login" required="" type="text" />
      </div>
      <div class="mb-4 text-start">
        <i class="bi bi-key" style="font-size: 30px;"></i>
        <input class="form-control" id="senha" name="senha" placeholder="Senha" required="" type="password" />
      </div>
      <button class="btn btn-green w-100" type="submit"><a style="text-decoration: none; color: white;"
          href="./dashboard.html">Entrar</a></button>
    </form>
    <p>Não possui cadastro? <a href="cadastro.html">Clique aqui</a></p>
  </div>
  <footer style=" color: #fff; text-align: center; padding: 20px; display: grid;">
    <p>&copy; 2025 Manawarah. Todos os direitos reservados.</p>
  </footer>
  
</body>

</html>
