
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - TechImóvel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
    body {
      background-color: #0F123F;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-box {
      background-color: #1B1E3F;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      width: 100%;
      max-width: 400px;
    }
    .btn-green {
      background-color: #00FF66;
      border: none;
      color: #000;
    }
    .btn-green:hover {
      background-color: #00cc55;
    }
    .logo {
      width: 120px;
      display: block;
      margin: 0 auto 1rem;
    }
  </style>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { width: 90%; max-width: 1200px; margin: auto; padding: 20px; }
        img { max-width: 100%; height: auto; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
        }
        </style></head>
<body>
<div class="login-box text-center">
<img alt="Logo TechImóvel" class="logo" src="./assets/logo/logo-techimovel.jfif" style="border-radius: 80px;"/>
<h2 class="mb-4">TechImóvel <p>Administrador</p></h2>
<form action="#" method="POST" onsubmit="event.preventDefault(); alert('Simulação de envio bem-sucedida!');">
<div class="mb-3 text-start">
<label class="form-label" for="usuario">Login</label>
<input class="form-control" id="usuario" name="usuario" required="" type="text"/>
</div>
<div class="mb-4 text-start">
<label class="form-label" for="senha">Senha</label>
<input class="form-control" id="senha" name="senha" required="" type="password"/>
</div>
<button class="btn btn-green w-100" type="submit">Entrar</button>
</form>
</div>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
