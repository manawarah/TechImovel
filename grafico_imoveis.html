<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>Dashboard - Gráfico</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .chart-container {
            width: 80%;
            margin: auto;
        }
    </style>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { width: 90%; max-width: 1200px; margin: auto; padding: 20px; }
        img { max-width: 100%; height: auto; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
        }
        </style></head>
<body>
<div class="chart-container">
<canvas id="graficoImoveis"></canvas>
</div>
<script>
// Pegando dados do PHP para o JS
const labels = ;
const data = {
    labels: labels,
    datasets: [{
        label: 'Captações',
        backgroundColor: 'rgba(54, 162, 235, 0.5)',
        borderColor: 'rgb(54, 162, 235)',
        borderWidth: 1,
        data: ,
    }]
};

const config = {
    type: 'bar', // pode mudar para 'line', 'pie', etc.
    data: data,
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    },
};

// Renderizar o gráfico
const graficoImoveis = new Chart(
    document.getElementById('graficoImoveis'),
    config
);
</script>
</body>
</html>
