<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel - TechImóvel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="shortcut icon" href="./assets/logo/favicon_io/favicon.ico" type="image/x-icon">

  <style>
    * {
      padding: 0;
      border: 0;
      box-sizing: border-box;
      margin: 0;
      font-size: 16px;
      font-family: Poetsen One;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .chart-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .charts {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      height: 100vh;
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0F123F;
      padding-top: 2rem;
      color: white;
    }

    .sidebar .nav-link {
      color: white;
      font-weight: 500;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background-color: #00FF66;
      color: #000;
      border-radius: 8px;
    }

    .logo {
      width: 120px;
      border-radius: 80px;
      display: block;
      margin: 0 auto 2rem;
    }

    .main-content {
      margin-left: 250px;
      padding: 2rem;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -250px;
        width: 250px;
        height: 100%;
        transition: left 0.3s;
        z-index: 1050;
      }

      .sidebar.show {
        left: 0;
      }

      .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1040;
      }

      .overlay.show {
        display: block;
      }

      .main-content {
        margin-left: 0 !important;
        padding-left: 1rem !important;
        padding-right: 1rem !important;
      }
    }

    .container-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      /* espaçamento entre cards */
      max-width: 100%;
      justify-content: center;
    }
  </style>
</head>

<body>
  <!-- Botão do menu (mobile) -->
  <nav class="navbar navbar-dark bg-dark d-lg-none">
    <div class="container-fluid">
      <button class="btn btn-outline-light" id="menuToggle"><i class="bi bi-list"></i></button>
      <span class="navbar-brand mb-0 h1">Gerenciador de Imóveis</span>
    </div>
  </nav>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Sidebar -->
  <div class="sidebar d-flex flex-column position-lg-static" id="sidebar">
    <img src="./assets/logo/logo-techimovel.jfif" alt="Logo" class="logo" />
    <nav class="nav flex-column px-3">
      <a class="nav-link" href="./dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a class="nav-link" href="./painel_crm.html"><i class="bi bi-person-lines-fill"></i> CRM</a>
      <a class="nav-link" href="./parceria_corretor.html"><i class="bi bi-building"></i> Parceria</a>
      <a class="nav-link" href="./construtora.html"><i class="bi bi-house-door-fill"></i> Construtora</a>
      <a class="nav-link" href="./index.html"><i class="bi bi-box-arrow-right"></i> Sair</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
      <h2>Gerenciador de Imóveis</h2>
      <div class="d-flex gap-2 flex-wrap">
        <a href="./crm_add_imovel.html" class="btn btn-primary">Adicionar Imóvel</a>
        <a href="./painel_crm.html" class="btn btn-secondary">Voltar</a>
      </div>
    </div>

    <div class="table-responsive">
      <div class="container-cards" class="row row-cols-1 row-cols-md-2 g-4" id="imovel-tbody"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modalImovel" tabindex="-1" aria-labelledby="modalImovelLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalImovelLabel">Detalhes do Imóvel</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="modalImovelBody">
          <!-- Detalhes dinâmicos aqui -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const toggleBtn = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('show');
      overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('show');
      overlay.classList.remove('show');
    });

    const tbody = document.getElementById("imovel-tbody");
    let imoveis = JSON.parse(localStorage.getItem("imoveis")) || [];

    function renderImoveis() {
      tbody.innerHTML = "";
      imoveis.forEach((imovel, index) => {
        const tr = document.createElement("div");
        tr.innerHTML = `
          <div class="card" style="width: 18rem; text-align: start;">
                <img src="./assets/construtoras/GET LIKE.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                      <h4 class="card-title"><i class="bi bi-house-door-fill"></i> ${imovel.nome_residencial}</h4>
                      <p>
                        <i class="bi bi-geo-alt-fill"></i> ${imovel.bairro} 
                        <br> 
                        <i class="bi bi-house-gear-fill"></i> ${imovel.quartos} quarto(s)
                        <br>
                        <i class="bi bi-blockquote-left"></i> ${imovel.tipo}
                        <br>
                        <i class="bi bi-cash-stack"></i> ${imovel.valor_venda}</p>
                      <p style="text-align: center;">
                        <button class="btn btn-dark btn-sm" onclick="mostrarDetalhesImovel(${index})"><i class="bi bi-binoculars-fill"></i></button>
                        <button class="btn btn-dark btn-sm" onclick="editarImovel(${index})"><i class="bi bi-pencil-fill"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="removerImovel(${index})"><i class="bi bi-trash3-fill"></i></button>
                      </p>
                  </div>
          </div> 
          <br>
           `;
        tbody.appendChild(tr);
      });
    }

    function editarImovel(index) {
      localStorage.setItem("editandoImovel", index);
      window.location.href = "crm_add_imovel.html";
    }

    function removerImovel(index) {
      if (confirm("Deseja remover este imóvel?")) {
        imoveis.splice(index, 1);
        localStorage.setItem("imoveis", JSON.stringify(imoveis));
        renderImoveis();
      }
    }

    function mostrarDetalhesImovel(index) {
      const imovel = imoveis[index];
      const detalhes = Object.entries(imovel).map(([chave, valor]) => {
        const titulo = chave.replace(/_/g, " ").replace(/\b\w/g, l => l.toUpperCase());
        return `<p><strong>${titulo}:</strong> ${valor || '-'}</p>`;
      }).join("");
      document.getElementById("modalImovelBody").innerHTML = detalhes;
      const modal = new bootstrap.Modal(document.getElementById("modalImovel"));
      modal.show();
    }

    renderImoveis();
  </script>
</body>

</html>
