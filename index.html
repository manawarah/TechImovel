<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - TechImóvel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #0F123F;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-box {
      background-color: #1B1E3F;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      width: 100%;
      max-width: 400px;
    }
    .btn-green {
      background-color: #00FF66;
      border: none;
      color: #000;
    }
    .btn-green:hover {
      background-color: #00cc55;
    }
    .logo {
      width: 120px;
      display: block;
      margin: 0 auto 1rem;
      border-radius: 80px;
    }
    @media (max-width: 575px) {
      .login-box {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-box text-center">
    <img src="./assets/logo/logo-techimovel.jfif" alt="Logo TechImóvel" class="logo">
    <h2 class="mb-2">TechImóvel</h2>
    <p class="mb-4">Acesso ao Sistema</p>

    <form action="index.php" method="POST">
      <div class="mb-3 text-start">
        <label for="login" class="form-label">Login</label>
        <input type="text" class="form-control" id="login" name="login" autocomplete="username" required>
      </div>
      <div class="mb-4 text-start">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="senha" name="senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-green w-100">Entrar</button>
    </form>
    <p class="mt-3">Não possui cadastro? <a href="cadastro.php" class="text-decoration-underline text-light">Clique aqui</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
