<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel CRM - TechImóvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="./assets/logo/favicon_io/favicon.ico" type="image/x-icon">
    <style>
        * {

            padding: 0;
            border: 0;
            box-sizing: border-box;
            margin: 0;
            font-size: 16px;
            font-family: Poetsen One;
        }

        html {
            justify-content: center;
            align-items: center;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            font-size: 1.5em;
            color: #333;
        }

        .card p {
            margin: 10px 0 0;
            color: #777;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .charts {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0F123F;
            padding-top: 2rem;
            color: white;
        }

        .sidebar .nav-link {
            color: white;
            font-weight: 500;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: #00FF66;
            color: #000;
            border-radius: 8px;
        }

        .logo {
            width: 120px;
            border-radius: 80px;
            display: block;
            margin: 0 auto 2rem;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -250px;
                width: 250px;
                height: 100%;
                transition: left 0.3s;
                z-index: 1050;
            }

            .sidebar.show {
                left: 0;
            }

            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 1040;
            }

            .overlay.show {
                display: block;
            }

            .main-content {
                margin-left: 0 !important;
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
        }
    </style>
</head>

<body>
    <!-- Botão do menu (mobile) -->
    <nav class="navbar navbar-dark bg-dark d-lg-none">
        <div class="container-fluid">
            <button class="btn btn-outline-light" id="menuToggle"><i class="bi bi-list"></i></button>
            <span class="navbar-brand mb-0 h1">Gerenciador de Clientes</span>
        </div>
    </nav>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column position-lg-static" id="sidebar">
        <img src="./assets/logo/logo-techimovel.jfif" alt="Logo" class="logo" />
        <nav class="nav flex-column px-3">
            <a class="nav-link" href="./dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a class="nav-link" href="./painel_crm.html"><i class="bi bi-person-lines-fill"></i> CRM</a>
            <a class="nav-link" href="./parceria_corretor.html"><i class="bi bi-building"></i> Parceria</a>
            <a class="nav-link" href="./construtora.html"><i class="bi bi-house-door-fill"></i> Construtora</a>
            <a class="nav-link" href="./index.html"><i class="bi bi-box-arrow-right"></i> Sair</a>
        </nav>
    </div>
    <br>
    <div class="main-content">
        <h2>Adicionar Cliente</h2>

        <form method="post" class="row g-3 mt-3">
            <h4>🙍‍♂️ Dados Pessoais</h4>
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" name="nome">
            </div>

            <div class="col-md-6">
                <label for="cpfNPJ" class="form-label">CPF/CNPJ</label>
                <input type="text" class="form-control" id="cpfCNPJ" name="cpfCNPJ">
            </div>

            <div class="col-md-6">
                <label for="datanascimento" class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="datanascimento" name="datanascimento">
            </div>

            <div class="col-md-6">
                <label for="sexo" class="form-label">Sexo</label>
                <select name="sexo" id="sexo" class="form-select">
                    <option selected>Sexo</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="estadocivil" class="form-label">Estado Civil</label>
                <select name="estadocivil" id="estadocivil" class="form-select">
                    <option selected>Estado Civil</option>
                    <option value="Solteiro(a)">Solteiro(a)</option>
                    <option value="Casado(a)">Casado(a)</option>
                    <option value="Separado(a) judicialmente">Separado(a) judicialmente</option>
                    <option value="Divorciado(a)">Divorciado(a)</option>
                    <option value="Viúvo(a)">Viúvo(a)</option>
                    <option value="União estável">Femenino</option>
                </select>
            </div>
            <br><br><br><br>
            <h4>📞 Contato</h4>

            <div class="col-md-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>

            <div class="col-md-6">
                <label for="telefone" class="form-label">Telefone fixo</label>
                <input type="telefone" class="form-control" id="telefone" name="telefone">
            </div>

            <div class="col-md-6">
                <label for="celular" class="form-label">Celular / WhatsApp</label>
                <input type="celular" class="form-control" id="celular" name="celular">
            </div>

            <br><br><br><br>
            <h4>🏠 Endereço</h4>

            <div class="col-md-6">
                <label for="cep" class="form-label">Cep</label>
                <input type="cep" class="form-control" id="cep" name="cep">
            </div>

            <div class="col-md-6">
                <label for="logradouro" class="form-label">Logradouro</label>
                <input type="logradouro" class="form-control" id="logradouro" name="logradouro">
            </div>

            <div class="col-md-6">
                <label for="numero" class="form-label">Número</label>
                <input type="numero" class="form-control" id="numero" name="numero">
            </div>

            <div class="col-md-6">
                <label for="complemento" class="form-label">Complemento</label>
                <input type="complemento" class="form-control" id="complemento" name="complemento">
            </div>

            <div class="col-md-6">
                <label for="bairro" class="form-label">Bairro</label>
                <input type="bairro" class="form-control" id="bairro" name="bairro">
            </div>

            <div class="col-md-6">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="cidade" class="form-control" id="cidade" name="cidade">
            </div>

            <div class="col-md-6">
                <label for="estado" class="form-label">Estado</label>
                <input type="estado" class="form-control" id="estado" name="estado">
            </div>

            <br><br><br><br>
            <h4>🏢 Dados Profissionais / Comerciais</h4>

            <div class="col-md-6">
                <label for="empresa" class="form-label">Empresa</label>
                <input type="empresa" class="form-control" id="empresa" name="empresa">
            </div>

            <div class="col-md-6">
                <label for="cargo" class="form-label">Cargo</label>
                <input type="cargo" class="form-control" id="cargo" name="cargo">
            </div>

            <div class="col-md-6">
                <label for="areaatuacao" class="form-label">Área de Atuação</label>
                <input type="areaatuacao" class="form-control" id="areaatuacao" name="areaatuacao">
            </div>

            <div class="col-md-6">
                <label for="cnpj" class="form-label">Cnpj</label>
                <input type="cnpj" class="form-control" id="cnpj" name="cnpj">
            </div>

            
            <div class="col-md-6">
                <label for="inscricao_estadual_municipal" class="form-label">Inscricao Estadual Municipal</label>
                <input type="inscricao_estadual_municipal" class="form-control" id="inscricao_estadual_municipal" name="inscricao_estadual_municipal">
            </div>

            <br><br><br><br>
            <h4>ℹ️ Informações Comerciais</h4>

            <div class="col-md-6">
                <label for="tipoCliente" class="form-label">Tipo Cliente</label>
                <select name="tipoCliente" id="tipoCliente" class="form-select">
                    <option selected>Tipo Cliente</option>
                    <option value="PessoaFísica">Pessoa Física</option>
                    <option value="PessoaJurídica">Pessoa Jurídica</option>
                </select>
            </div>
                        
            <div class="col-md-6">
                <label for="categoriaSegmento" class="form-label">Categoria / Segmento</label>
                <input type="categoriaSegmento" class="form-control" id="categoriaSegmento" name="categoriaSegmento">
            </div>
            
            <div class="col-md-6">
                <label for="origemContato" class="form-label">Origem do contato</label>
                <select name="origemContato" id="origemContato" class="form-select">
                    <option selected>Origem do contato</option>
                    <option value="Indicação">Indicação</option>
                    <option value="Site">Site</option>
                    <option value="Redes Sociais">Redes Sociais</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="statusCliente" class="form-label">Status do cliente</label>
                <select name="statusCliente" id="statusCliente" class="form-select">
                    <option selected>Status do cliente</option>
                    <option value="Novo">Novo</option>
                    <option value="Ativo">Ativo</option>
                    <option value="Inativo">Inativo</option>
                    <option value="Potencial">Potencial</option>
                </select>
            </div>
            <br><br><br><br>
            <h4>🗒️ Observações adicionais</h4>

            <div class="col-md-6">
                <label for="notas" class="form-label">Notas ou comentários livres</label>
                    <textarea type="notas" class="form-control" id="notas" name="notas"></textarea>
            </div>

            <div class="col-md-6">
                <label for="necessidade" class="form-label">Interesses específicos / necessidades</label>
                    <textarea type="necessidade" class="form-control" id="necessidade" name="necessidade"></textarea>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                <a href="./crm_gerenciador_cliente.html" class="btn btn-secondary">Voltar</a>
            </div>

            

        </form>
    </div>



    <footer style=" color: #222; text-align: center; padding: 20px;">
        <p>&copy; 2025 Manawarah. Todos os direitos reservados.</p>
    </footer>



    <script>
        const toggleBtn = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        });
    </script>

    <!-- Dados do formulário do Add cliente pegando valores e jogando para a tabela -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const editIndex = params.get('edit');

        if (editIndex !== null) {
            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            const cliente = clientes[editIndex];

            if (cliente) {
                document.getElementById('nome').value = cliente.nome;
                document.getElementById('cpfCNPJ').value = cliente.cpfCNPJ;
                document.getElementById('datanascimento').value = cliente.datanascimento;
                document.getElementById('sexo').value = cliente.sexo;
                document.getElementById('estadocivil').value = cliente.estadocivil;
                document.getElementById('email').value = cliente.email;
                document.getElementById('telefone').value = cliente.telefone;
                document.getElementById('celular').value = cliente.celular;
                document.getElementById('cep').value = cliente.cep;
                document.getElementById('logradouro').value = cliente.logradouro;
                document.getElementById('numero').value = cliente.numero;
                document.getElementById('complemento').value = cliente.complemento;
                document.getElementById('bairro').value = cliente.bairro;
                document.getElementById('cidade').value = cliente.cidade;
                document.getElementById('estado').value = cliente.estado;
                document.getElementById('empresa').value = cliente.empresa;
                document.getElementById('cargo').value = cliente.cargo;
                document.getElementById('areaatuacao').value = cliente.areaatuacao;
                document.getElementById('cnpj').value = cliente.cnpj;
                document.getElementById('inscricao_estadual_municipal').value = cliente.inscricao_estadual_municipal;
                document.getElementById('tipoCliente').value = cliente.tipoCliente;
                document.getElementById('categoriaSegmento').value = cliente.categoriaSegmento;
                document.getElementById('origemContato').value = cliente.origemContato;
                document.getElementById('statusCliente').value = cliente.statusCliente;
                document.getElementById('notas').value = cliente.notas;
                document.getElementById('necessidade').value = cliente.necessidade;


            }
        }

        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();

            const cliente = {
                nome: document.getElementById('nome').value,
                cpfCNPJ: document.getElementById('cpfCNPJ').value,
                datanascimento: document.getElementById('datanascimento').value,
                sexo: document.getElementById('sexo').value,
                estadocivil: document.getElementById('estadocivil').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                celular: document.getElementById('celular').value,
                cep: document.getElementById('cep').value,
                logradouro: document.getElementById('logradouro').value,
                numero: document.getElementById('numero').value,
                complemento: document.getElementById('complemento').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value,
                empresa: document.getElementById('empresa').value,
                cargo: document.getElementById('cargo').value,
                areaatuacao: document.getElementById('areaatuacao').value,
                cnpj: document.getElementById('cnpj').value,
                inscricao_estadual_municipal: document.getElementById('inscricao_estadual_municipal').value,
                tipoCliente: document.getElementById('tipoCliente').value,
                categoriaSegmento: document.getElementById('categoriaSegmento').value,
                origemContato: document.getElementById('origemContato').value,
                statusCliente: document.getElementById('statusCliente').value,
                notas: document.getElementById('notas').value,
                necessidade: document.getElementById('necessidade').value,


            };

            let clientes = JSON.parse(localStorage.getItem('clientes')) || [];

            if (editIndex !== null) {
                clientes[editIndex] = cliente; // Edita
            } else {
                clientes.push(cliente); // Adiciona novo
            }

            localStorage.setItem('clientes', JSON.stringify(clientes));
            window.location.href = './crm_gerenciador_cliente.html';
        });
    </script>


</body>

</html>
