

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Imóvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Adicionar Novo Imóvel</h2>

        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Título</label>
                <input name="titulo" class="form-control" placeholder="Título do Imóvel" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Construtora</label>
                <input name="construtora" class="form-control" placeholder="Nome da Construtora" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Metragem</label>
                <input name="metragem" class="form-control" placeholder="Ex: 80m²" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Localização</label>
                <input name="localizacao" class="form-control" placeholder="Endereço ou Cidade" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Preço</label>
                <input name="preco" class="form-control" placeholder="Ex: 500000" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Imagem</label>
                <input type="file" name="imagem" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Link para Mais Informações</label>
                <input name="link_mais_info" class="form-control" placeholder="URL (opcional)">
            </div>
            <div class="d-flex justify-content-between">
                <a href="./includes/painel_admin.php" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-success">Adicionar Imóvel</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
