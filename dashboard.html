

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - TechImóvel</title>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin: 0;
            font-size: 1.5em;
            color: #333;
        }
        .card p {
            margin: 10px 0 0;
            color: #777;
        }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .charts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h2>Dashboard TechImóvel</h2>

<!-- Cards -->
<div class="cards">
    <div class="card">
        <h3></h3>
        <p>Imóveis Cadastrados</p>
    </div>
    <div class="card">
        <h3></h3>
        <p>Clientes no CRM</p>
    </div>
    <div class="card">
        <h3>R$ </h3>
        <p>Valor Médio</p>
    </div>
    <div class="card">
        <h3></h3>
        <p>Parcerias</p>
    </div>
</div>

<!-- Gráficos -->
<div class="charts">
    <div class="chart-container">
        <h3>Imóveis por Bairro</h3>
        <canvas id="graficoBairros"></canvas>
    </div>
    <div class="chart-container">
        <h3>Top 10 Imóveis - Valor</h3>
        <canvas id="graficoValores"></canvas>
    </div>
</div>



</body>
</html>
