<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cadastro - TechImóvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        * {

            padding: 0;
            border: 0;
            box-sizing: border-box;
            margin: 0;
            font-size: 16px;
            font-family: Poetsen One;
        }

        html {

            display: flex;
            justify-content: center;
            align-items: center;
        }

        body {
            background-color: #0F123F;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-box {
            background-color: #1B1E3F;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            width: 100%;
            max-width: 450px;
        }

        .btn-green {
            background-color: #00FF66;
            border: none;
            color: #000;
        }

        .btn-green:hover {
            background-color: #00cc55;
        }

        .logo {
            width: 120px;
            display: block;
            margin: 0 auto 1rem;
            border-radius: 80px;
        }
    </style>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
        }
    </style>
</head>

<body style="display: grid;">
    <div class="login-box text-center">
        <img alt="Logo TechImóvel" class="logo" src="./assets/logo/logo-techimovel.jfif" />
        <h2 class="mb-4">TechImóvel</h2>
        <p style="font-size: 14pt;">Cadastro</p>
        <form action="#" class="row g-3" method="post"
            onsubmit="event.preventDefault(); alert('Simulação de envio bem-sucedida!');">
            <div class="col-md-6">
                <input class="form-control" id="nome" name="nome" placeholder="Nome" required="" type="text" />
            </div>
            <div class="col-md-6">
                <input class="form-control" id="contato" name="contato" placeholder="Contato" required="" type="text" />
            </div>
            <div class="col-12">
                <input class="form-control" id="email" name="email" placeholder="E-mail" required="" type="email" />
            </div>
            <div class="col-12">
                <input class="form-control" id="login" name="login" placeholder="Login" required="" type="text" />
            </div>
            <div class="col-12">
                <input class="form-control" id="senha" name="senha" placeholder="Senha" required="" type="password" />
            </div>
            <div class="col-md-6">
                <input class="form-control" id="creci" name="creci" placeholder="Creci" required="" type="text" />
            </div>
            <div class="col-md-6">
                <select class="form-select" id="regiao" name="regiao" required="">
                    <option disabled="" selected="" value="">Selecione o Estado</option>
                    <optgroup label="Norte">
                        <option value="AC">Acre (AC)</option>
                        <option value="AP">Amapá (AP)</option>
                        <option value="AM">Amazonas (AM)</option>
                        <option value="PA">Pará (PA)</option>
                        <option value="RO">Rondônia (RO)</option>
                        <option value="RR">Roraima (RR)</option>
                        <option value="TO">Tocantins (TO)</option>
                    </optgroup>
                    <optgroup label="Nordeste">
                        <option value="AL">Alagoas (AL)</option>
                        <option value="BA">Bahia (BA)</option>
                        <option value="CE">Ceará (CE)</option>
                        <option value="MA">Maranhão (MA)</option>
                        <option value="PB">Paraíba (PB)</option>
                        <option value="PE">Pernambuco (PE)</option>
                        <option value="PI">Piauí (PI)</option>
                        <option value="RN">Rio Grande do Norte (RN)</option>
                        <option value="SE">Sergipe (SE)</option>
                    </optgroup>
                    <optgroup label="Centro-Oeste">
                        <option value="DF">Distrito Federal (DF)</option>
                        <option value="GO">Goiás (GO)</option>
                        <option value="MT">Mato Grosso (MT)</option>
                        <option value="MS">Mato Grosso do Sul (MS)</option>
                    </optgroup>
                    <optgroup label="Sudeste">
                        <option value="ES">Espírito Santo (ES)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="SP">São Paulo (SP)</option>
                    </optgroup>
                    <optgroup label="Sul">
                        <option value="PR">Paraná (PR)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                    </optgroup>
                </select>
            </div>
            <div class="col-12">
                <div class="form-check text-start" style="display: flex;">
                    <input class="form-check-input" id="termos" required="" type="checkbox" />
                    <label class="form-check-label" for="termos">
                        Ao continuar, você aceita nossos
                        <a data-bs-target="#modalTermos" data-bs-toggle="modal" href="#">Termos de Uso</a> e Política de
                        Privacidade.
                    </label>
                </div>
            </div>
            <div class="col-12">
                <button class="btn btn-green w-100" type="submit">Cadastrar</button>
            </div>
        </form>
        <p class="mt-3">Já possui cadastro? <a href="index.html">Clique aqui</a></p>
    </div>
    <!-- Modal dos Termos -->
    <div aria-hidden="true" aria-labelledby="modalTermosLabel" class="modal fade" id="modalTermos" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-dark">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTermosLabel">Termos de Uso e Política de Privacidade</h5>
                    <button aria-label="Fechar" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <footer style=" color: #fff; text-align: center; padding: 20px;">
        <p>&copy; 2025 Manawarah. Todos os direitos reservados.</p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
