    <style>
        * {

            padding: 0;
            border: 0;
            box-sizing: border-box;
            margin: 0;
            font-size: 16px;
            font-family: Poetsen One;
        }

        html {
            justify-content: center;
            align-items: center;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            font-size: 1.5em;
            color: #333;
        }

        .card p {
            margin: 10px 0 0;
            color: #777;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .charts {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0F123F;
            padding-top: 2rem;
            color: white;
        }

        .sidebar .nav-link {
            color: white;
            font-weight: 500;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: #00FF66;
            color: #000;
            border-radius: 8px;
        }

        .logo {
            width: 120px;
            border-radius: 80px;
            display: block;
            margin: 0 auto 2rem;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -250px;
                width: 250px;
                height: 100%;
                transition: left 0.3s;
                z-index: 1050;
            }

            .sidebar.show {
                left: 0;
            }

            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 1040;
            }

            .overlay.show {
                display: block;
            }

            .main-content {
                margin-left: 0 !important;

    <script>
        // Máscara de telefone (formato BR)
        document.getElementById("telefone").addEventListener("input", function (e) {
            let x = e.target.value.replace(/\D/g, "").match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : "(" + x[1] + ") " + x[2] + (x[3] ? "-" + x[3] : "");
        });

        // Máscara de CEP
        document.getElementById("cep").addEventListener("input", function (e) {
            let x = e.target.value.replace(/\D/g, "").match(/(\d{0,5})(\d{0,3})/);
            e.target.value = x[2] ? `${x[1]}-${x[2]}` : x[1];
        });

        // Função para aplicar máscara monetária (R$)
        function aplicarMascaraMonetaria(id) {
            const input = document.getElementById(id);
            input.addEventListener("input", function () {
                let valor = input.value.replace(/\D/g, "");
                valor = (valor / 100).toFixed(2) + '';
                valor = valor.replace(".", ",");
                valor = valor.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                input.value = "R$ " + valor;
            });
        }

        aplicarMascaraMonetaria("valor_venda");
        aplicarMascaraMonetaria("valor_aluguel");
        aplicarMascaraMonetaria("iptu");
        aplicarMascaraMonetaria("condominio");

        // Validação básica de e-mail
        document.getElementById("form").addEventListener("submit", function (e) {
            const email = document.getElementById("email").value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(email)) {
                e.preventDefault();
                alert("E-mail inválido. Verifique o formato (ex: nome@dominio.com)");
            }
        });
    </script>
