<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel CRM - TechImóvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="./assets/logo/favicon_io/favicon.ico" type="image/x-icon">
    <style>
        * {

            padding: 0;
            border: 0;
            box-sizing: border-box;
            margin: 0;
            font-size: 16px;
            font-family: Poetsen One;
        }

        html {
            justify-content: center;
            align-items: center;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0;
            font-size: 1.5em;
            color: #333;
        }

        .card p {
            margin: 10px 0 0;
            color: #777;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .charts {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0F123F;
            padding-top: 2rem;
            color: white;
        }

        .sidebar .nav-link {
            color: white;
            font-weight: 500;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background-color: #00FF66;
            color: #000;
            border-radius: 8px;
        }

        .logo {
            width: 120px;
            border-radius: 80px;
            display: block;
            margin: 0 auto 2rem;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -250px;
                width: 250px;
                height: 100%;
                transition: left 0.3s;
                z-index: 1050;
            }

            .sidebar.show {
                left: 0;
            }

            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 1040;
            }

            .overlay.show {
                display: block;
            }

            .main-content {
                margin-left: 0 !important;
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
        }
    </style>
</head>

<body>
    <!-- Botão do menu (mobile) -->
    <nav class="navbar navbar-dark bg-dark d-lg-none">
        <div class="container-fluid">
            <button class="btn btn-outline-light" id="menuToggle"><i class="bi bi-list"></i></button>
            <span class="navbar-brand mb-0 h1">Gerenciador de Clientes</span>
        </div>
    </nav>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column position-lg-static" id="sidebar">
        <img src="./assets/logo/logo-techimovel.jfif" alt="Logo" class="logo" />
        <nav class="nav flex-column px-3">
            <a class="nav-link" href="./dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a class="nav-link" href="./painel_crm.html"><i class="bi bi-person-lines-fill"></i> CRM</a>
            <a class="nav-link" href="./parceria_corretor.html"><i class="bi bi-building"></i> Parceria</a>
            <a class="nav-link" href="./construtora.html"><i class="bi bi-house-door-fill"></i> Construtora</a>
            <a class="nav-link" href="./index.html"><i class="bi bi-box-arrow-right"></i> Sair</a>
        </nav>
    </div>
    <br>
    <div class="main-content">
        <h2>Adicionar Cliente</h2>

        <form method="post" class="row g-3 mt-3">
            <h4>🙍‍♂️ Dados Pessoais</h4>
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome completo">
            </div>

            <div class="col-md-6">
                <label for="cpf_cnpj" class="form-label">CPF/CNPJ</label>
                <input type="text" class="form-control" id="cpf_cnpj" name="cpf_cnpj" placeholder="Digite o CPF ou CNPJ">
            </div>

            <div class="col-md-6">
                <label for="data_nascimento" class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="data_nascimento" name="data_nascimento">
            </div>

            <div class="col-md-6">
                <label for="sexo" class="form-label">Sexo</label>
                <select name="sexo" id="sexo" class="form-select">
                    <option selected disabled>Selecione o sexo</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="estado_civil" class="form-label">Estado Civil</label>
                <select name="estado_civil" id="estado_civil" class="form-select">
                    <option selected disabled>Selecione o estado civil</option>
                    <option value="Solteiro(a)">Solteiro(a)</option>
                    <option value="Casado(a)">Casado(a)</option>
                    <option value="Separado(a) judicialmente">Separado(a) judicialmente</option>
                    <option value="Divorciado(a)">Divorciado(a)</option>
                    <option value="Viúvo(a)">Viúvo(a)</option>
                    <option value="União estável">União estável</option>
                </select>
            </div>

            <h4>📞 Contato</h4>

            <div class="col-md-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="exemplo@email.com">
            </div>

            <div class="col-md-6">
                <label for="telefone" class="form-label">Telefone fixo</label>
                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(XX) XXXX-XXXX">
            </div>

            <div class="col-md-6">
                <label for="celular" class="form-label">Celular / WhatsApp</label>
                <input type="tel" class="form-control" id="celular" name="celular" placeholder="(XX) XXXXX-XXXX">
            </div>

            <h4>🏠 Endereço</h4>

            <div class="col-md-6">
                <label for="cep" class="form-label">Cep</label>
                <input type="text" class="form-control" id="cep" name="cep" placeholder="Digite o CEP">
            </div>

            <div class="col-md-6">
                <label for="logradouro" class="form-label">Logradouro</label>
                <input type="text" class="form-control" id="logradouro" name="logradouro"
                    placeholder="Rua, avenida, etc.">
            </div>

            <div class="col-md-6">
                <label for="numero" class="form-label">Número</label>
                <input type="text" class="form-control" id="numero" name="numero" placeholder="Número da residência">
            </div>

            <div class="col-md-6">
                <label for="complemento" class="form-label">Complemento</label>
                <input type="text" class="form-control" id="complemento" name="complemento"
                    placeholder="Apartamento, bloco, etc.">
            </div>

            <div class="col-md-6">
                <label for="bairro" class="form-label">Bairro</label>
                <input type="text" class="form-control" id="bairro" name="bairro" placeholder="Digite o bairro">
            </div>

            <div class="col-md-6">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" name="cidade" placeholder="Digite a cidade">
            </div>

            <div class="col-md-6">
                <label for="estado" class="form-label">Estado</label>
                <input type="text" class="form-control" id="estado" name="estado" placeholder="Digite o estado">
            </div>

            <h4>🏢 Dados Profissionais / Comerciais</h4>

            <div class="col-md-6">
                <label for="empresa" class="form-label">Empresa</label>
                <input type="text" class="form-control" id="empresa" name="empresa" placeholder="Nome da empresa">
            </div>

            <div class="col-md-6">
                <label for="cargo" class="form-label">Cargo</label>
                <input type="text" class="form-control" id="cargo" name="cargo" placeholder="Cargo ocupado">
            </div>

            <div class="col-md-6">
                <label for="area_atuacao" class="form-label">Área de Atuação</label>
                <input type="text" class="form-control" id="area_atuacao" name="area_atuacao"
                    placeholder="Ex: Vendas, TI, RH...">
            </div>

            <div class="col-md-6">
                <label for="cnpj" class="form-label">CNPJ</label>
                <input type="text" class="form-control" id="cnpj" name="cnpj" placeholder="Digite o CNPJ">
            </div>

            <div class="col-md-6">
                <label for="inscricao_estadual_municipal" class="form-label">Inscrição Estadual/Municipal</label>
                <input type="text" class="form-control" id="inscricao_estadual_municipal"
                    name="inscricao_estadual_municipal" placeholder="Digite a inscrição">
            </div>

            <h4>ℹ️ Informações Comerciais</h4>

            <div class="col-md-6">
                <label for="tipo_cliente" class="form-label">Tipo Cliente</label>
                <select name="tipo_cliente" id="tipo_cliente" class="form-select">
                    <option selected disabled>Selecione o tipo de cliente</option>
                    <option value="PessoaFísica">Pessoa Física</option>
                    <option value="PessoaJurídica">Pessoa Jurídica</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="categoria_segmento" class="form-label">Categoria / Segmento</label>
                <input type="text" class="form-control" id="categoria_segmento" name="categoria_segmento"
                    placeholder="Segmento de mercado">
            </div>

            <div class="col-md-6">
                <label for="origem_contato" class="form-label">Origem do contato</label>
                <select name="origem_contato" id="origem_contato" class="form-select">
                    <option selected disabled>Selecione a origem</option>
                    <option value="Indicação">Indicação</option>
                    <option value="Site">Site</option>
                    <option value="Redes Sociais">Redes Sociais</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="status_cliente" class="form-label">Status do cliente</label>
                <select name="status_cliente" id="status_cliente" class="form-select">
                    <option selected disabled>Selecione o status</option>
                    <option value="Novo">Novo</option>
                    <option value="Ativo">Ativo</option>
                    <option value="Inativo">Inativo</option>
                    <option value="Potencial">Potencial</option>
                </select>
            </div>

            <h4>🗒️ Observações adicionais</h4>

            <div class="col-md-6">
                <label for="notas" class="form-label">Notas ou comentários livres</label>
                <textarea class="form-control" id="notas" name="notas"
                    placeholder="Digite observações ou comentários..."></textarea>
            </div>

            <div class="col-md-6">
                <label for="necessidade" class="form-label">Interesses específicos / necessidades</label>
                <textarea type="necessidade" class="form-control" id="necessidade" name="necessidade"
                    placeholder="Digite necessidades ou interesses..."></textarea>
            </div>

            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                <a href="./crm_gerenciador_cliente.html" class="btn btn-secondary">Voltar</a>
            </div>



        </form>
    </div>



    <footer style=" color: #222; text-align: center; padding: 20px;">
        <p>&copy; 2025 Manawarah. Todos os direitos reservados.</p>
    </footer>



    <script>
        const toggleBtn = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('show');
            overlay.classList.toggle('show');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        });
    </script>

    <!-- Dados do formulário do Add cliente pegando valores e jogando para a tabela -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const editIndex = params.get('edit');

        if (editIndex !== null) {
            const clientes = JSON.parse(localStorage.getItem('clientes')) || [];
            const cliente = clientes[editIndex];

            if (cliente) {
                document.getElementById('nome').value = cliente.nome;
                document.getElementById('cpf_cnpj').value = cliente.cpf_cnpj;
                document.getElementById('data_nascimento').value = cliente.data_nascimento;
                document.getElementById('sexo').value = cliente.sexo;
                document.getElementById('estado_civil').value = cliente.estado_civil;
                document.getElementById('email').value = cliente.email;
                document.getElementById('telefone').value = cliente.telefone;
                document.getElementById('celular').value = cliente.celular;
                document.getElementById('cep').value = cliente.cep;
                document.getElementById('logradouro').value = cliente.logradouro;
                document.getElementById('numero').value = cliente.numero;
                document.getElementById('complemento').value = cliente.complemento;
                document.getElementById('bairro').value = cliente.bairro;
                document.getElementById('cidade').value = cliente.cidade;
                document.getElementById('estado').value = cliente.estado;
                document.getElementById('empresa').value = cliente.empresa;
                document.getElementById('cargo').value = cliente.cargo;
                document.getElementById('area_atuacao').value = cliente.area_atuacao;
                document.getElementById('cnpj').value = cliente.cnpj;
                document.getElementById('inscricao_estadual_municipal').value = cliente.inscricao_estadual_municipal;
                document.getElementById('tipo_cliente').value = cliente.tipo_cliente;
                document.getElementById('categoria_segmento').value = cliente.categoria_segmento;
                document.getElementById('origem_contato').value = cliente.origem_contato;
                document.getElementById('status_cliente').value = cliente.status_cliente;
                document.getElementById('notas').value = cliente.notas;
                document.getElementById('necessidade').value = cliente.necessidade;


            }
        }

        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();

            const cliente = {
                nome: document.getElementById('nome').value,
                cpf_cnpj: document.getElementById('cpf_cnpj').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                sexo: document.getElementById('sexo').value,
                estado_civil: document.getElementById('estado_civil').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                celular: document.getElementById('celular').value,
                cep: document.getElementById('cep').value,
                logradouro: document.getElementById('logradouro').value,
                numero: document.getElementById('numero').value,
                complemento: document.getElementById('complemento').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value,
                empresa: document.getElementById('empresa').value,
                cargo: document.getElementById('cargo').value,
                area_atuacao: document.getElementById('area_atuacao').value,
                cnpj: document.getElementById('cnpj').value,
                inscricao_estadual_municipal: document.getElementById('inscricao_estadual_municipal').value,
                tipo_cliente: document.getElementById('tipo_cliente').value,
                categoria_segmento: document.getElementById('categoria_segmento').value,
                origem_contato: document.getElementById('origem_contato').value,
                status_cliente: document.getElementById('status_cliente').value,
                notas: document.getElementById('notas').value,
                necessidade: document.getElementById('necessidade').value,


            };

            let clientes = JSON.parse(localStorage.getItem('clientes')) || [];

            if (editIndex !== null) {
                clientes[editIndex] = cliente; // Edita
            } else {
                clientes.push(cliente); // Adiciona novo
            }

            localStorage.setItem('clientes', JSON.stringify(clientes));
            window.location.href = './crm_gerenciador_cliente.html';
        });
    </script>

    <script>
        function aplicarMascara(input, tipo) {
            input.addEventListener("input", function () {
                let valor = input.value.replace(/\D/g, ""); // remove tudo que não for dígito

                switch (tipo) {
                    case "cpf_cnpj":
                        if (valor.length <= 11) {
                            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
                            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
                            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
                        } else {
                            valor = valor.replace(/^(\d{2})(\d)/, "$1.$2");
                            valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
                            valor = valor.replace(/\.(\d{3})(\d)/, ".$1/$2");
                            valor = valor.replace(/(\d{4})(\d)/, "$1-$2");
                        }
                        break;

                    case "telefone":
                        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
                        valor = valor.replace(/(\d{4})(\d)/, "$1-$2");
                        break;

                    case "celular":
                        valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
                        valor = valor.replace(/(\d{5})(\d)/, "$1-$2");
                        break;

                    case "cep":
                        valor = valor.replace(/^(\d{5})(\d)/, "$1-$2");
                        break;

                    case "cnpj":
                        valor = valor.replace(/^(\d{2})(\d)/, "$1.$2");
                        valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
                        valor = valor.replace(/\.(\d{3})(\d)/, ".$1/$2");
                        valor = valor.replace(/(\d{4})(\d)/, "$1-$2");
                        break;
                }

                input.value = valor;
            });
        }

        // Aplica as máscaras quando o DOM carregar
        document.addEventListener("DOMContentLoaded", function () {
            aplicarMascara(document.getElementById("cpf_cnpj"), "cpf_cnpj");
            aplicarMascara(document.getElementById("telefone"), "telefone");
            aplicarMascara(document.getElementById("celular"), "celular");
            aplicarMascara(document.getElementById("cep"), "cep");
            aplicarMascara(document.getElementById("cnpj"), "cnpj");
        });
    </script>

</body>

</html>
