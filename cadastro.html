<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - TechImóvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="./assets/logo/favicon_io/favicon.ico" type="image/x-icon">

    <style>
        * {
            padding: 0;
            border: 0;
            box-sizing: border-box;
            margin: 0;
            font-size: 16px;
            font-family: Poetsen One;
        }

        body {
            background-color: #0F123F;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            flex-direction: column;
        }

        .login-box {
            background-color: #1B1E3F;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            width: 100%;
            max-width: 500px;
        }

        .btn-green {
            background-color: #00FF66;
            border: none;
            color: #000;
        }

        .btn-green:hover {
            background-color: #00cc55;
        }

        .logo {
            width: 120px;
            border-radius: 80px;
            display: block;
            margin: 0 auto 1rem;
        }

        @media (max-width: 576px) {
            .login-box {
                padding: 1.5rem;
            }

            .form-control,
            .form-select {
                font-size: 1rem;
            }

            .btn-green {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-box text-center">
        <img alt="Logo TechImóvel" class="logo" src="./assets/logo/logo-techimovel.jfif" />
        <h2 class="mb-3">TechImóvel</h2>
        <p class="mb-4" style="font-size: 14pt;">Cadastro</p>

        <form action="#" method="post" class="row g-3"
            onsubmit="event.preventDefault(); alert('Simulação de envio bem-sucedida!');">

            <div class="col-md-6 col-12">
                <input class="form-control" id="nome" name="nome" placeholder="Nome" required type="text" />
            </div>

            <div class="col-md-6 col-12">
                <input class="form-control" id="contato" name="contato" placeholder="Contato" required type="text" />
            </div>

            <div class="col-12">
                <input class="form-control" id="email" name="email" placeholder="E-mail" required type="email" />
            </div>

            <div class="col-12">
                <input class="form-control" id="login" name="login" placeholder="Login" required type="text" />
            </div>

            <div class="col-12">
                <input class="form-control" id="senha" name="senha" placeholder="Senha" required type="password" />
            </div>

            <div class="col-md-6 col-12">
                <input class="form-control" id="creci" name="creci" placeholder="Creci" required type="text" />
            </div>

            <div class="col-md-6 col-12">
                <select class="form-select" id="regiao" name="regiao" required>
                    <option disabled selected value="">Selecione o Estado</option>
                    <optgroup label="Norte">
                        <option value="AC">Acre (AC)</option>
                        <option value="AP">Amapá (AP)</option>
                        <option value="AM">Amazonas (AM)</option>
                        <option value="PA">Pará (PA)</option>
                        <option value="RO">Rondônia (RO)</option>
                        <option value="RR">Roraima (RR)</option>
                        <option value="TO">Tocantins (TO)</option>
                    </optgroup>
                    <optgroup label="Nordeste">
                        <option value="AL">Alagoas (AL)</option>
                        <option value="BA">Bahia (BA)</option>
                        <option value="CE">Ceará (CE)</option>
                        <option value="MA">Maranhão (MA)</option>
                        <option value="PB">Paraíba (PB)</option>
                        <option value="PE">Pernambuco (PE)</option>
                        <option value="PI">Piauí (PI)</option>
                        <option value="RN">Rio Grande do Norte (RN)</option>
                        <option value="SE">Sergipe (SE)</option>
                    </optgroup>
                    <optgroup label="Centro-Oeste">
                        <option value="DF">Distrito Federal (DF)</option>
                        <option value="GO">Goiás (GO)</option>
                        <option value="MT">Mato Grosso (MT)</option>
                        <option value="MS">Mato Grosso do Sul (MS)</option>
                    </optgroup>
                    <optgroup label="Sudeste">
                        <option value="ES">Espírito Santo (ES)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="SP">São Paulo (SP)</option>
                    </optgroup>
                    <optgroup label="Sul">
                        <option value="PR">Paraná (PR)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                    </optgroup>
                </select>
            </div>

            <div class="col-12 text-start">
                <div class="form-check">
                    <input class="form-check-input" id="termos" type="checkbox" required>
                    <label class="form-check-label" for="termos">
                        Ao continuar, você aceita nossos
                        <a href="#" data-bs-toggle="modal" data-bs-target="#modalTermos">Termos de Uso</a> e Política de
                        Privacidade.
                    </label>
                </div>
            </div>

            <div class="col-12">
                <button class="btn btn-green w-100" type="submit">Cadastrar</button>
            </div>
        </form>

        <p class="mt-3">Já possui cadastro? <a href="index.html">Clique aqui</a></p>
    </div>

    <!-- Modal dos Termos -->
    <div class="modal fade" id="modalTermos" tabindex="-1" aria-labelledby="modalTermosLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-dark">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTermosLabel">Termos de Uso e Política de Privacidade</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                    <p>./INCLUDES/TERMO</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-white mt-4">
        <p>&copy; 2025 Manawarah. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          const form = document.querySelector('form'); // Certifique-se de que há um <form> no HTML
      
          form.addEventListener('submit', function (e) {
            e.preventDefault();
      
            const nome = document.querySelector('input[name="nome"]').value.trim();
            const contato = document.querySelector('input[name="contato"]').value.trim();
            const email = document.querySelector('input[name="email"]').value.trim();
            const login = document.querySelector('input[name="login"]').value.trim();
            const senha = document.querySelector('input[name="senha"]').value;
            const creci = document.querySelector('input[name="creci"]').value.trim();
            const regiao = document.querySelector('input[name="regiao"]').value.trim();
      
            if (!nome || !contato || !email || !login || !senha || !creci || !regiao) {
              alert("Por favor, preencha todos os campos.");
              return;
            }
      
            // Aqui você pode adicionar lógica para salvar os dados (ex: via fetch API para back-end)
            console.log({ nome, contato, email, login, senha, creci, regiao});
      
            alert("Cadastro realizado com sucesso!");
            window.location.href = "index.html"; // Redireciona para login após cadastro
          });
        });
      </script>
      
</body>

</html>
