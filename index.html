<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - TechImóvel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="shortcut icon" href="./assets/logo/favicon_io/favicon.ico" type="image/x-icon">
  <style>
    * {
      padding: 0;
      border: 0;
      box-sizing: border-box;
      margin: 0;
      font-size: 16px;
      font-family: Poetsen One;
    }

    body {
      background-color: #0F123F;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      padding: 20px;
    }

    .login-box {
      background-color: #1B1E3F;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .btn-green {
      background-color: #00FF66;
      border: none;
      color: #000;
    }

    .btn-green:hover {
      background-color: #00cc55;
    }

    .logo {
      width: 120px;
      border-radius: 80px;
      display: block;
      margin: 0 auto 1rem;
    }

    footer {
      color: #fff;
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 576px) {
      .login-box {
        padding: 1.5rem;
      }

      .login-box h2 {
        font-size: 1.4rem;
      }

      .login-box p {
        font-size: 1rem;
      }

      .login-box input {
        font-size: 1rem;
      }

      .btn-green {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <div class="login-box text-center">
    <img alt="Logo TechImóvel" class="logo" src="./assets/logo/logo-techimovel.jfif" />
    <h2 class="mb-3">TechImóvel</h2>
    <p style="font-size: 14pt;">App Tecnologia Imobiliária</p>
    <form onsubmit="event.preventDefault(); window.location.href='./dashboard.html';">
      <div class="mb-3 text-start">
        <i class="bi bi-person" style="font-size: 1.5rem;"></i>
        <input class="form-control mt-1" id="login" name="login" placeholder="Login" required type="text" />
      </div>
      <div class="mb-4 text-start">
        <i class="bi bi-key" style="font-size: 1.5rem;"></i>
        <input class="form-control mt-1" id="senha" name="senha" placeholder="Senha" required type="password" />
      </div>
      <button class="btn btn-green w-100" type="submit"><a style="list-style: none; color: white;"
          href="./dashboard.html">Entrar</a></button>
    </form>
    <p class="mt-3">Não possui cadastro? <a href="cadastro.html" class="text-decoration-underline text-white">Clique
        aqui</a></p>
  </div>

  <footer>
    <p>&copy; 2025 Manawarah. Todos os direitos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
