
<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>Dashboard - TechImóvel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin: 0;
            font-size: 1.5em;
            color: #333;
        }
        .card p {
            margin: 10px 0 0;
            color: #777;
        }
        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .charts {
                grid-template-columns: 1fr;
            }
        }
    </style>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { width: 90%; max-width: 1200px; margin: auto; padding: 20px; }
        img { max-width: 100%; height: auto; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
        }
        </style></head>
<body>
<h2>Dashboard TechImóvel</h2>
<!-- Cards -->
<div class="cards">
<div class="card">
<h3></h3>
<p>Imóveis Cadastrados</p>
</div>
<div class="card">
<h3></h3>
<p>Clientes no CRM</p>
</div>
<div class="card">
<h3>R$ </h3>
<p>Valor Médio</p>
</div>
<div class="card">
<h3></h3>
<p>Parcerias</p>
</div>
</div>
<!-- Gráficos -->
<div class="charts">
<div class="chart-container">
<h3>Imóveis por Bairro</h3>
<canvas id="graficoBairros"></canvas>
</div>
<div class="chart-container">
<h3>Top 10 Imóveis - Valor</h3>
<canvas id="graficoValores"></canvas>
</div>
</div>
<script>
// Gráfico de Bairros
const labelsBairros = ;
const dataBairros = {
    labels: labelsBairros,
    datasets: [{
        label: 'Quantidade',
        backgroundColor: 'rgba(75, 192, 192, 0.5)',
        borderColor: 'rgba(75, 192, 192, 1)',
        borderWidth: 1,
        data: ,
    }]
};

const configBairros = {
    type: 'bar',
    data: dataBairros,
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
};

new Chart(
    document.getElementById('graficoBairros'),
    configBairros
);

// Gráfico de Valores
const labelsValores = ;
const dataValores = {
    labels: labelsValores,
    datasets: [{
        label: 'Valor (R$)',
        backgroundColor: 'rgba(153, 102, 255, 0.5)',
        borderColor: 'rgba(153, 102, 255, 1)',
        borderWidth: 1,
        data: ,
    }]
};

const configValores = {
    type: 'bar',
    data: dataValores,
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
};

new Chart(
    document.getElementById('graficoValores'),
    configValores
);
</script>
</body>
</html>
